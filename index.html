<style>/* Intro (inline, damit es vor allem anderen und auch mit alten Caches funktioniert) */
#intro{position:absolute;inset:0;z-index:95;overflow:hidden;background:radial-gradient(110% 70% at 50% 42%,#3b2615 0%,#1b1009 52%,#090504 100%);transition:opacity .62s cubic-bezier(.4,0,.2,1),transform .62s cubic-bezier(.4,0,.2,1);animation:inSafe .6s 7s forwards}
#intro.done{opacity:0;transform:scale(1.06);pointer-events:none}
@keyframes inSafe{to{opacity:0;visibility:hidden}}
#intro .in-logo{position:absolute;left:0;right:0;top:calc(44% - 78px);display:flex;flex-direction:column;align-items:center;opacity:0;animation:inLogo .9s cubic-bezier(.2,.8,.2,1) .1s forwards}
#intro .hoprow{display:flex;align-items:center;gap:14px;height:56px}
#intro .hoprow i{display:block;width:52px;height:2px;background:linear-gradient(90deg,rgba(217,160,50,0),#d9a032);border-radius:1px;margin-top:6px;transform:scaleX(0);animation:inLine .7s cubic-bezier(.2,.8,.2,1) .45s forwards}
#intro .hoprow i+img+i{background:linear-gradient(90deg,#d9a032,rgba(217,160,50,0))}#intro .hoprow img{height:56px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
#intro .wm{font-family:'Lora',Georgia,serif;font-weight:700;font-size:46px;letter-spacing:-.6px;line-height:1;margin-top:4px;color:#f6ead2;text-shadow:0 2px 14px rgba(0,0,0,.45)}
#intro .wm b{background:linear-gradient(180deg,#f6cf6e,#d49222);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#intro .tag{font-size:12.5px;letter-spacing:3.4px;color:#cfae76;margin-top:9px;font-weight:600;opacity:0;animation:inFade .6s ease .6s forwards}
@keyframes inLogo{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes inLine{to{transform:none}}@keyframes inFade{to{opacity:1}}
#intro .in-glow{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,120,.16),rgba(255,196,120,0));opacity:0;animation:inFade 1.4s ease .15s forwards}
@media (prefers-reduced-motion:reduce){#intro .in-logo,#intro .tag,#intro .hoprow i{animation-duration:.01s}#intro{transition-duration:.3s}#intro.done{transform:none}}

#home{display:none}
</style>
</head>
<body>
<div id="brandside"><h1>Hopfen<span>Match</span></h1><p>Gute Biere. Gute Leute.</p><p style="font-size:14px">Bier, Wein und Whisky bewerten, Matches mit Freunden finden und gemeinsam Tasting-Abende planen.</p></div>
<div id="hint">Am iPhone in Safari öffnen und über <b>Teilen → Zum Home-Bildschirm</b> als App installieren.</div>
<div id="stage"><div id="device">
 <div id="screen">
  <div id="statusbar"><span id="sbtime">9:41</span><span class="sb-r" id="sbicons"></span></div>
  <div id="island"></div>
  <div class="layer tabs">
   <section class="tabview on" id="tab-start"></section>
   <section class="tabview" id="tab-rangliste"></section>
   <section class="tabview" id="tab-freunde"></section>
   <section class="tabview" id="tab-planen"></section>
  </div>
  <div class="shade" id="shade"></div>
  <nav id="nav"></nav>
  <button id="plus" aria-label="Bier bewerten"></button>
  <div id="intro" aria-hidden="true">
   <div class="in-glow"></div>
   <div class="in-logo"><div class="hoprow"><i></i><img src="img/hop_logo_t.webp" alt=""><i></i></div><div class="wm">Hopfen<b>Match</b></div><div class="tag">BIER · WEIN · WHISKY</div></div>
     </div>
  <div id="home" tabindex="-1" aria-label="Kategorie wählen"></div>
  <div id="sheets"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="homebar"></div>
 </div>
</div></div>
<script>(function(){var i=document.getElementById('intro');if(!i)return;try{var w=document.getElementById('screen').clientWidth;i.style.setProperty('--iw',w+'px')}catch(e){}
if(/[?&]nointro/.test(location.search)){i.remove();return}
setTimeout(function(){if(i.isConnected&&!window.HM_INTRO&&!window.HM_INTRO_HOLD){i.classList.add('done');setTimeout(function(){i.remove()},700)}},4500)})();</script>
<script src="js/data.js?v=10"></script>
<script src="js/catalog.js?v=10"></script>
<script src="js/bottle.js?v=10"></script>
<script src="js/wine.js?v=10"></script>
<script src="js/whisky.js?v=10"></script>
<script src="js/home.js?v=10"></script>
<script src="js/bounce.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
