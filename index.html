<style>/* Intro (inline, damit es vor allem anderen und auch mit alten Caches funktioniert) */
#intro{position:absolute;inset:0;z-index:95;overflow:hidden;background:radial-gradient(110% 70% at 50% 36%,#3b2615 0%,#1b1009 52%,#090504 100%);transition:opacity .62s cubic-bezier(.4,0,.2,1),transform .62s cubic-bezier(.4,0,.2,1);animation:inSafe .6s 7s forwards}
#intro.done{opacity:0;transform:scale(1.06);pointer-events:none}
@keyframes inSafe{to{opacity:0;visibility:hidden}}
#intro .in-logo{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;opacity:0;animation:inLogo .9s cubic-bezier(.2,.8,.2,1) .1s forwards}
#intro .hoprow{display:flex;align-items:center;gap:14px;height:56px}
#intro .hoprow i{display:block;width:52px;height:2px;background:linear-gradient(90deg,rgba(217,160,50,0),#d9a032);border-radius:1px;margin-top:6px;transform:scaleX(0);animation:inLine .7s cubic-bezier(.2,.8,.2,1) .45s forwards}
#intro .hoprow i+img+i{background:linear-gradient(90deg,#d9a032,rgba(217,160,50,0))}#intro .hoprow img{height:56px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
#intro .wm{font-family:'Lora',Georgia,serif;font-weight:700;font-size:46px;letter-spacing:-.6px;line-height:1;margin-top:4px;color:#f6ead2;text-shadow:0 2px 14px rgba(0,0,0,.45)}
#intro .wm b{background:linear-gradient(180deg,#f6cf6e,#d49222);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#intro .tag{font-size:12.5px;letter-spacing:3.4px;color:#cfae76;margin-top:9px;font-weight:600;opacity:0;animation:inFade .6s ease .6s forwards}
@keyframes inLogo{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes inLine{to{transform:none}}@keyframes inFade{to{opacity:1}}
/* Flasche rollt (Draufsicht, Studiofoto): sie wandert quer, Etikett und Halsetikett laufen um den Glaskörper, Glanzlichter bleiben stehen */
#intro .in-track{position:absolute;left:0;right:0;top:47%;height:min(340px,50%)}
#intro .in-cv{position:absolute;left:0;top:0;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){#intro .in-track{display:none}#intro .in-logo,#intro .tag,#intro .hoprow i{animation-duration:.01s}#intro{transition-duration:.3s}#intro.done{transform:none}}

#home{display:none}
</style>

<script>(function(){var i=document.getElementById('intro');if(!i)return;try{var w=document.getElementById('screen').clientWidth;i.style.setProperty('--iw',w+'px')}catch(e){}
if(/[?&]nointro/.test(location.search)){i.remove();return}
/* Rollende Flasche: Foto (Alpha) + Etiketten, je Frame spaltenweise auf den Zylinder projiziert */
(function(){var tr=i.querySelector('.in-track'),c=i.querySelector('.in-cv');if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var L=function(s){var m=new Image();m.src=s;return m},fl=L('img/intro_flasche.webp'),et=L('img/intro_etikett.webp'),hs=L('img/intro_hals.webp');
var x=c.getContext('2d'),t0=performance.now(),D=Math.min(window.devicePixelRatio||1,3),W,Hc,sc,run=true;
/* Maße in Foto-Einheiten (Ausschnitt 320×1127) */
var CW0=320,CH0=1127,CX0=159.5,RB=140,LY0=657,LY1=983,RN=54.5,NY0=55,NY1=103;
function size(){var r=tr.getBoundingClientRect();W=r.width;Hc=r.height;c.width=Math.round(W*D);c.height=Math.round(Hc*D);sc=Math.min(318,Hc-14)/CH0*D}
size();
var LC=document.createElement('canvas'),LM=document.createElement('canvas');
function band(img,xc,R,y0,y1,dx,arc,full){var iw=img.naturalWidth,ih=img.naturalHeight,C=2*Math.PI*R,Lw=full?C:arc,w=Math.ceil(2*R)+2,h=Math.ceil(y1-y0),ox=Math.floor(xc-R)-1;
 if(LC.width<w||LC.height<h){LC.width=LM.width=Math.max(w,LC.width);LC.height=LM.height=Math.max(h,LC.height)}
 var l=LC.getContext('2d'),m=LM.getContext('2d');l.globalCompositeOperation='source-over';l.clearRect(0,0,LC.width,LC.height);m.clearRect(0,0,LM.width,LM.height);
 for(var px=ox;px<ox+w;px++){var u=(px+.5-xc)/R;if(u<=-.995||u>=.995)continue;var s=R*Math.asin(u)-dx+Lw*.5,sm=((s%C)+C)%C;if(sm>=Lw)continue;
  var sx=sm/Lw*iw,sw=Math.max(.6,iw/Lw/Math.sqrt(1-u*u));l.drawImage(img,Math.min(iw-sw,sx),0,sw,ih,px-ox,0,1,h)}
 m.drawImage(LC,0,0);
 var g=l.createLinearGradient(xc-R-ox,0,xc+R-ox,0);g.addColorStop(0,'#2c241c');g.addColorStop(.1,'#a39684');g.addColorStop(.27,'#ffffff');g.addColorStop(.55,'#efe6da');g.addColorStop(.86,'#7d7163');g.addColorStop(1,'#1e1812');
 l.globalCompositeOperation='multiply';l.fillStyle=g;l.fillRect(0,0,w,h);
 var hl=l.createLinearGradient(xc-R-ox,0,xc+R-ox,0);hl.addColorStop(.17,'rgba(255,255,255,0)');hl.addColorStop(.23,'rgba(255,250,238,.42)');hl.addColorStop(.3,'rgba(255,255,255,0)');hl.addColorStop(.86,'rgba(255,255,255,0)');hl.addColorStop(.9,'rgba(255,240,220,.16)');hl.addColorStop(.94,'rgba(255,255,255,0)');
 l.globalCompositeOperation='screen';l.fillStyle=hl;l.fillRect(0,0,w,h);
 l.globalCompositeOperation='destination-in';l.drawImage(LM,0,0);l.globalCompositeOperation='source-over';
 x.drawImage(LC,0,0,w,h,ox,y0,w,h)}
function frame(now){if(!run||!i.isConnected)return;var t=window.HM_INTRO_T!=null?window.HM_INTRO_T:(now-t0)/1000,p=(t-.75)/1.65;x.clearRect(0,0,c.width,c.height);
 if(p>0&&p<1&&fl.complete&&fl.naturalWidth){var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;e=e*.55+p*.45;
  var bw=CW0*sc,xc=-bw*.6+(c.width+bw*1.2)*e,top=(c.height-CH0*sc)/2,dx=xc;
  x.save();x.globalAlpha=.55;var sg=x.createRadialGradient(xc,top+CH0*sc*.98,2,xc,top+CH0*sc*.98,bw*.8);sg.addColorStop(0,'rgba(0,0,0,.7)');sg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sg;x.fillRect(xc-bw,top+CH0*sc*.9,2*bw,CH0*sc*.2);x.restore();
  x.drawImage(fl,xc-CX0*sc,top,CW0*sc,CH0*sc);
  if(et.complete&&et.naturalWidth)band(et,xc,RB*sc,top+LY0*sc,top+LY1*sc,dx,(LY1-LY0)*sc*et.naturalWidth/et.naturalHeight,false);
  if(hs.complete&&hs.naturalWidth)band(hs,xc,RN*sc,top+NY0*sc,top+NY1*sc,dx*RN/RB,0,true)}
 if(t<3.2||window.HM_INTRO_T!=null)requestAnimationFrame(frame)}
requestAnimationFrame(frame)})();
setTimeout(function(){if(i.isConnected&&!window.HM_INTRO&&!window.HM_INTRO_HOLD){i.classList.add('done');setTimeout(function(){i.remove()},700)}},4500)})();</script>
